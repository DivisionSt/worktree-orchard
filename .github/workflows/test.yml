name: test

on:
  push:
    branches: [main]
  pull_request:

# The token a run gets can read the repo and nothing else, so a workflow
# run from someone's pull request cannot push, tag or comment.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -yq tmux
          else
            brew install tmux
          fi
      - run: make test
      # macOS still ships bash 3.2 as /bin/bash, and that is what many users
      # will run this under. Putting it first on PATH makes both the harness
      # and the script's own #!/usr/bin/env bash pick it up.
      - name: Test under macOS's bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          export PATH="$RUNNER_TEMP/bash32:$PATH"
          bash --version | head -1
          make test
